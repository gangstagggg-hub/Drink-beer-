<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enda en?</title>
  <meta name="description" content="Ansiktsskanneren som avgjør om du kan drikke mer.">
  <meta name="theme-color" content="#1a1109">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Enda en?">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app" data-state="idle">

    <header class="top">
      <img src="icons/icon.svg" alt="" width="40" height="40" class="logo">
      <div>
        <h1>Enda en?</h1>
        <p class="sub">Ansiktsskanneren som vet best</p>
      </div>
    </header>

    <section class="stage" aria-label="Skanner">
      <div class="lens-wrap" id="lensWrap">
        <div class="lens">
          <video id="cam" playsinline muted autoplay></video>

          <svg class="silhouette" viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="92" rx="46" ry="58" fill="none" stroke="currentColor" stroke-width="2.5"/>
            <path d="M34 200 C40 156 70 146 100 146 C130 146 160 156 166 200" fill="none" stroke="currentColor" stroke-width="2.5"/>
          </svg>

          <svg class="guide" viewBox="0 0 200 200" aria-hidden="true">
            <ellipse cx="100" cy="98" rx="56" ry="72" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round"/>
          </svg>

          <div class="dots" id="dots" aria-hidden="true"></div>
          <div class="scanline" aria-hidden="true"></div>
        </div>

        <div class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5.5 12.5 L10 17 L18.5 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <p class="status" id="status" aria-live="polite">Hold ansiktet innenfor ringen</p>
      <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <h2 id="verdict"></h2>
      <p class="comment" id="comment"></p>
      <dl class="metrics" id="metrics"></dl>
      <p class="count" id="count"></p>
    </section>

    <div class="actions">
      <button class="primary" id="go" type="button">Skann ansiktet</button>
      <button class="ghost" id="share" type="button" hidden>Del resultatet</button>
    </div>

    <p class="fine">Kun for underholdning. Ikke en promillemåler, og bildet forlater aldri telefonen. Drikk ansvarlig og la bilen stå.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
