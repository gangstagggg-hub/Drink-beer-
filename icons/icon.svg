<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2511"/>
      <stop offset="1" stop-color="#150d06"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="46%">
      <stop offset="0" stop-color="#f6b73c" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f6b73c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd45e"/>
      <stop offset=".55" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#c76a0b"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#ffe7b0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ceb98"/>
      <stop offset="1" stop-color="#18964f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g transform="translate(256 256) scale(1.0) translate(-278 -296)">
    <!-- handle -->
    <path d="M300 218 H336 a42 42 0 0 1 42 42 V296 a42 42 0 0 1 -42 42 H300"
          fill="none" stroke="#fff3d3" stroke-opacity=".92" stroke-width="26" stroke-linejoin="round"/>
    <path d="M300 218 H336 a42 42 0 0 1 42 42 V296 a42 42 0 0 1 -42 42 H300"
          fill="none" stroke="#f6b73c" stroke-opacity=".35" stroke-width="8" stroke-linejoin="round"/>

    <!-- glass body -->
    <path d="M124 172 H304 V376 a30 30 0 0 1 -30 30 H154 a30 30 0 0 1 -30 -30 Z"
          fill="#fff3d3" fill-opacity=".2" stroke="#fff3d3" stroke-opacity=".95" stroke-width="8" stroke-linejoin="round"/>

    <!-- beer -->
    <path d="M136 180 H292 V364 a22 22 0 0 1 -22 22 H158 a22 22 0 0 1 -22 -22 Z" fill="url(#beer)"/>

    <!-- bubbles + highlight -->
    <g fill="#fff3d3" fill-opacity=".6">
      <circle cx="172" cy="338" r="5"/><circle cx="198" cy="296" r="3.5"/><circle cx="168" cy="262" r="3"/>
      <circle cx="244" cy="344" r="4"/><circle cx="266" cy="304" r="5"/><circle cx="232" cy="256" r="3"/>
      <circle cx="214" cy="322" r="2.5"/>
    </g>
    <rect x="148" y="218" width="12" height="140" rx="6" fill="#fff" fill-opacity=".28"/>

    <!-- foam -->
    <g fill="url(#foam)">
      <circle cx="146" cy="178" r="30"/>
      <circle cx="190" cy="158" r="38"/>
      <circle cx="240" cy="160" r="38"/>
      <circle cx="282" cy="178" r="28"/>
      <rect x="132" y="176" width="164" height="36" rx="12"/>
      <circle cx="160" cy="212" r="14"/>
      <circle cx="214" cy="220" r="18"/>
      <circle cx="268" cy="212" r="13"/>
    </g>

    <!-- check badge -->
    <circle cx="336" cy="372" r="98" fill="#150d06"/>
    <circle cx="336" cy="372" r="84" fill="url(#green)"/>
    <path d="M298 374 L327 403 L378 340" fill="none" stroke="#fff" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>